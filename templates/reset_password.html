<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset password — SAYPS</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background:#fdf8f0; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
        .box { background:white; padding:32px; border-radius:16px; box-shadow:0 4px 18px rgba(140,90,60,0.12); width:340px; }
        .box h3 { color:#8c5a3c; margin-top:0; }
        input { width:100%; padding:10px; margin-bottom:12px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
        button { width:100%; padding:10px; background:#6a9b5e; color:white; border:none; border-radius:8px; cursor:pointer; }
        .error { color:#c0392b; font-size:0.85rem; margin-bottom:10px; }
        a { color:#6a9b5e; font-size:0.88rem; }
    </style>
</head>
<body>
    <div class="box">
        {% if invalid %}
            <h3>Link not valid</h3>
            <p>This reset link has expired or was already used.</p>
            <a href="/forgot-password">Request a new link</a>
        {% else %}
            <h3>Set a new password</h3>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <form method="POST">
                <input type="password" name="new_password" placeholder="New password (8+ characters)" required>
                <input type="password" name="confirm_password" placeholder="Confirm new password" required>
                <button type="submit">Save password</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
