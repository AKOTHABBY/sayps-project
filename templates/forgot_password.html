<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot password — SAYPS</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background:#fdf8f0; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
        .box { background:white; padding:32px; border-radius:16px; box-shadow:0 4px 18px rgba(140,90,60,0.12); width:340px; }
        .box h3 { color:#8c5a3c; margin-top:0; }
        input { width:100%; padding:10px; margin-bottom:12px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
        button { width:100%; padding:10px; background:#6a9b5e; color:white; border:none; border-radius:8px; cursor:pointer; }
        .info { color:#2f6b3d; background:#eaf3ec; padding:10px 12px; border-radius:8px; font-size:0.88rem; margin-bottom:12px; }
        a { color:#6a9b5e; font-size:0.88rem; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Forgot password</h3>
        {% if sent %}
        <div class="info">If that email is registered, a reset link has been sent. It is valid for 1 hour.</div>
        {% endif %}
        <form method="POST">
            <input type="email" name="email" placeholder="Your email address" required>
            <button type="submit">Send reset link</button>
        </form>
        <p style="margin-bottom:0;"><a href="/login">Back to login</a></p>
    </div>
</body>
</html>
